<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header, .history-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
        }

        .history-card h2 {
            margin-top: 0;
        }

        .details {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .recommendation {
            white-space: pre-wrap;
            line-height: 1.7;
        }

        .back-button {
            display: block;
            text-align: center;
            padding: 12px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📋 PocketSmart AI History</h1>
        <p>Previous AI recommendations</p>
    </div>

    {% if history %}

        {% for item in history %}

        <div class="history-card">

            <h2>{{ item.type }}</h2>

            <div class="details">
                {{ item.details }}
            </div>

            <div class="recommendation">
                {{ item.recommendation }}
            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="history-card">
            <p>No recommendations saved yet.</p>
        </div>

    {% endif %}

    <a href="/" class="back-button">
        ← Back to PocketSmart AI
    </a>

</div>

</body>
</html>
