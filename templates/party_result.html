<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Party Recommendation</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
        }

        .details {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            line-height: 1.8;
        }

        .recommendation {
            line-height: 1.7;
            white-space: pre-wrap;
            font-size: 16px;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 25px;
            padding: 12px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎉 PocketSmart AI</h1>

    <h2>Your Party Plan</h2>

    <div class="details">
        <strong>Budget:</strong> ₹{{ budget }}<br>
        <strong>Guests:</strong> {{ guests }}<br>
        <strong>Event:</strong> {{ event_type }}<br>
        <strong>Venue:</strong> {{ venue }}
    </div>

    <div class="recommendation">
        {{ recommendation }}
    </div>

    <a href="/party.html" class="back-button">
        ← Create Another Party Plan
    </a>

</div>

</body>
</html>
