<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Home Recommendation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px 15px;
            color: #222;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        .header {
            background: #222;
            color: white;
            padding: 30px;
            border-radius: 14px;
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            color: #ddd;
        }

        .details {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .details h2 {
            margin-top: 0;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .detail-box {
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .detail-box strong {
            display: block;
            margin-bottom: 7px;
            color: #555;
        }

        .recommendation-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .recommendation-card h2 {
            margin-top: 0;
        }

        .recommendation {
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 16px;
            color: #333;
        }

        .success {
            background: #f1f8f3;
            border-left: 5px solid #333;
            padding: 15px;
            margin-top: 20px;
            border-radius: 6px;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 13px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-size: 16px;
        }

        .back-button:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🏠 PocketSmart AI</h1>
        <p>Smart Home Interior Recommendation</p>
    </div>

    <div class="details">

        <h2>📋 Your Plan</h2>

        <div class="detail-grid">

            <div class="detail-box">
                <strong>Budget</strong>
                ₹{{ budget }}
            </div>

            <div class="detail-box">
                <strong>Room</strong>
                {{ room }}
            </div>

            <div class="detail-box">
                <strong>Quantity</strong>
                {{ quantity }}
            </div>

        </div>

    </div>

    <div class="recommendation-card">

        <h2>🤖 AI Recommendation</h2>

        <div class="recommendation">
            {{ recommendation }}
        </div>

        <div class="success">
            ✅ This recommendation was generated by PocketSmart AI based on your budget and requirements.
        </div>

    </div>

    <a href="/" class="back-button">
        ← Create Another Plan
    </a>

</div>

</body>
</html>
