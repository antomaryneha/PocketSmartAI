<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PocketSmart AI - Party Planner</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 18px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎉 PocketSmart AI</h1>
    <h2>Party Budget Planner</h2>

    <form action="/generate-party" method="get">

        <label for="budget">Total Budget (₹)</label>
        <input
            type="number"
            id="budget"
            name="budget"
            min="1"
            placeholder="Enter your budget"
            required
        >

        <label for="guests">Number of Guests</label>
        <input
            type="number"
            id="guests"
            name="guests"
            min="1"
            placeholder="Enter guest count"
            required
        >

        <label for="event_type">Event Type</label>
        <select id="event_type" name="event_type" required>
            <option value="">Select an event</option>
            <option value="Birthday">Birthday</option>
            <option value="Wedding">Wedding</option>
            <option value="Corporate Event">Corporate Event</option>
            <option value="Engagement">Engagement</option>
            <option value="Family Function">Family Function</option>
        </select>

        <label for="venue">Venue</label>
        <input
            type="text"
            id="venue"
            name="venue"
            placeholder="Enter venue or location"
            required
        >

        <button type="submit">
            Get AI Party Recommendations
        </button>

    </form>

</div>

</body>
</html>
